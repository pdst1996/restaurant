spring.application.name=restaurant
server.servlet.context-path=/api


# PostgreSQL properties
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8088

# JWToken
app.jwt.secret=${RESTAURANT_JWT_SECRET}
app.jwt.expiration-ms=${RESTAURANT_JWT_EXPIRATION_MS:500000}
springdoc.remove-broken-reference-definitions=false

# Seeder
app.seed.enabled=${RESTAURANT_SAMPLE_SEED:false}
app.seed.user.password=${RESTAURANT_SAMPLE_PASSWORD:}
app.bootstrap.admin-email=${RESTAURANT_BOOTSTRAP_ADMIN_EMAIL:admin@psrestaurant.com}
app.bootstrap.admin-password=${RESTAURANT_BOOTSTRAP_ADMIN_PASSWORD:}
app.orders.tax-rate=${RESTAURANT_ORDER_TAX_RATE:0}
app.cors.allowed-origins=${RESTAURANT_CORS_ORIGINS:http://localhost:5173}
